<header class="site-header">
  <div class="shell nav-shell">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} home">
      <span class="brand-mark" aria-hidden="true">ZL</span>
      <span class="brand-name">Zhaoyang Liu</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <span class="sr-only">Toggle navigation</span>
      <span></span><span></span><span></span>
    </button>
    <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}
        {{ if and $current.IsHome (eq .PageRef "/") }}{{ $active = true }}{{ end }}
        <a href="{{ .URL }}"{{ if $active }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
